<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회원가입 로그인 화면</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff;color:#262345;font-family:'Noto Sans KR',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6e5ce6}a:hover{color:#5748c4;text-decoration:underline}
button{font-family:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; font-family: 'Noto Sans KR', -apple-system, system-ui, sans-serif; color: #262345; overflow: hidden; position: relative">

  <header style="height: 56px; margin-top: 44px; display: flex; align-items: center; padding: 0 8px; flex-shrink: 0">
    <a href="Landing.html" aria-label="뒤로" style="width: 44px; height: 44px; color: #262345; display: inline-flex; align-items: center; justify-content: center; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; padding: 8px 20px 0; gap: 28px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 12px">
      <div style="width: 140px; height: 140px; border-radius: 999px; background: #eceaf5; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #716d8e">[일러스트]</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
        <h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em">반가워요,<br>사주풀이에 오신 걸 환영해요</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4a4668">간편 로그인으로 3초 만에 시작합니다.<br>첫 오늘의 운세는 무료예요.</p>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #fee500; color: #191600; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="position: absolute; left: 18px"><path d="M12 3C6.5 3 2 6.4 2 10.6c0 2.7 1.8 5 4.5 6.4l-1 3.7c-.1.3.3.6.6.4l4.4-2.9c.5.1 1 .1 1.5.1 5.5 0 10-3.4 10-7.7S17.5 3 12 3z"></path></svg>카카오로 시작하기</button>
      <button type="button" style="height: 52px; border: 1px solid #dcd9ea; border-radius: 12px; background: #ffffff; color: #262345; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 18px"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>Google로 시작하기</button>
      <button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #6e5ce6; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 18px"><rect x="5" y="2" width="14" height="20" rx="2.5"></rect><path d="M11 18h2"></path></svg>Apple로 시작하기</button>
      <button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #eceaf5; color: #262345; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 18px"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>이메일로 시작하기</button>
    </div>

    <p style="margin: 0; text-align: center; font-size: 12px; line-height: 1.6; color: #625e80">시작하면 <a href="#terms" style="color: #4a4668; text-decoration: underline">이용약관</a>과 <a href="#privacy" style="color: #4a4668; text-decoration: underline">개인정보 처리방침</a>에 동의하게 됩니다.<br>생년월일시는 풀이에만 쓰이고 외부에 제공되지 않아요.</p>
  </main>

  <footer style="padding: 0 20px 36px; text-align: center; font-size: 13px; color: #625e80; flex-shrink: 0">이미 계정이 있나요? <a href="#login-email" style="color: #6e5ce6; font-weight: 500; text-decoration: none">이메일로 로그인</a></footer>
</div>
</body>
</html>
