<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘의 운세 화면</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff;color:#262345;font-family:'Noto Sans KR',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6e5ce6}a:hover{color:#5748c4;text-decoration:underline}
button{font-family:inherit}
</style>
<div style="width: 390px; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; font-family: 'Noto Sans KR', -apple-system, system-ui, sans-serif; color: #262345; overflow: hidden; position: relative">

  <header style="height: 56px; margin-top: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; flex-shrink: 0">
    <a href="Home.html" aria-label="뒤로" style="width: 44px; height: 44px; color: #262345; display: inline-flex; align-items: center; justify-content: center; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="font-size: 15px; font-weight: 600">오늘의 운세</span>
    <button type="button" aria-label="공유" style="width: 44px; height: 44px; border: 0; background: transparent; color: #262345; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"></path></svg></button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 4px 16px 16px; overflow: hidden">
    <div style="border-radius: 24px; background: #6e5ce6; padding: 20px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden">
      <div style="position: absolute; right: 16px; top: 16px; width: 88px; height: 88px; border-radius: 16px; background: #2b2457; display: flex; align-items: center; justify-content: center; font-size: 11px; color: rgba(255, 255, 255, 0.5)">[일러스트]</div>
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 12px; font-weight: 500; color: rgba(255, 255, 255, 0.72)">2026년 11월 9일 월요일</span>
        <span style="height: 20px; padding: 0 8px; border-radius: 6px; background: #257f60; color: #ffffff; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">길 吉</span>
      </div>
      <h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 26px; font-weight: 700; line-height: 1.3; color: #ffffff; max-width: 220px">말보다 글이<br>통하는 날</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.55; color: rgba(255, 255, 255, 0.85); max-width: 230px">부족했던 水 기운이 들어와 甲木의 뿌리를 적십니다. 미뤄 둔 메시지를 보내 보세요.</p>
    </div>

    <section aria-label="분야별 운세" style="border: 1px solid #dcd9ea; border-radius: 16px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #eceaf5">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #fde8ef; color: #c2366b; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg></span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">연애운</span><span style="font-size: 13px; color: #4a4668">먼저 연락하면 뜻밖의 답이 옵니다</span></div>
        <span style="display: inline-flex; gap: 3px" aria-label="5점 만점에 4점"><span style="width: 8px; height: 8px; border-radius: 999px; background: #6e5ce6"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #6e5ce6"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #6e5ce6"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #6e5ce6"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #dcd9ea"></span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #eceaf5">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #fff4d6; color: #9a6700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10M9.5 9.5h3.5a1.75 1.75 0 0 1 0 3.5H9.5m0 0h4a1.75 1.75 0 0 1 0 3.5H9.5"></path></svg></span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">금전운</span><span style="font-size: 13px; color: #4a4668">작은 지출이 모입니다, 기록하세요</span></div>
        <span style="display: inline-flex; gap: 3px" aria-label="5점 만점에 3점"><span style="width: 8px; height: 8px; border-radius: 999px; background: #6e5ce6"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #6e5ce6"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #6e5ce6"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #dcd9ea"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #dcd9ea"></span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #eceaf5">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #e3eefc; color: #2b63c6; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">직장운</span><span style="font-size: 13px; color: #4a4668">문서·보고가 잘 풀리는 날</span></div>
        <span style="display: inline-flex; gap: 3px" aria-label="5점 만점에 5점"><span style="width: 8px; height: 8px; border-radius: 999px; background: #6e5ce6"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #6e5ce6"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #6e5ce6"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #6e5ce6"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #6e5ce6"></span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #eceaf5; color: #716d8e; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">행운의 시간</span><span style="font-size: 13px; color: #4a4668">오후 3시 ~ 5시 (申時)</span></div>
        <div style="display: flex; gap: 6px"><span style="height: 26px; padding: 0 10px; border-radius: 22px; background: #e3eefc; color: #2b63c6; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">남색</span><span style="height: 26px; padding: 0 10px; border-radius: 22px; background: #eceaf5; color: #4a4668; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">북쪽</span></div>
      </div>
    </section>

    <div style="border: 1px solid #dcd9ea; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; background: #f7f6fc">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #625e80">내일 운세는 자정에 열려요</span>
        <span style="font-size: 14px; font-weight: 600">알림 받고 매일 확인하기</span>
      </div>
      <button type="button" role="switch" aria-checked="true" aria-label="알림" style="width: 48px; height: 28px; border: 0; border-radius: 14px; background: #6e5ce6; position: relative; cursor: pointer; flex-shrink: 0"><span style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 999px; background: #ffffff"></span></button>
    </div>

    <a href="Category.html" style="height: 52px; border-radius: 26px; border: 1px solid #dcd9ea; background: #ffffff; color: #262345; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none; gap: 6px">올해 흐름 전체 풀이 보기<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></a>
  </main>

  <nav aria-label="주 메뉴" style="height: 56px; padding-bottom: 28px; border-top: 1px solid #dcd9ea; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; background: #ffffff; flex-shrink: 0; box-sizing: content-box">
    <a href="Home.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #262345; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"></path></svg>홈</a>
    <a href="Category.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #625e80; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>탐색</a>
    <a href="Library.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #625e80; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>보관함</a>
    <a href="MyPage.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #625e80; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>마이</a>
  </nav>
</div>
</body>
</html>
