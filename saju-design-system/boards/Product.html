<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>상품 상세 화면</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff;color:#262345;font-family:'Noto Sans KR',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6e5ce6}a:hover{color:#5748c4;text-decoration:underline}
button{font-family:inherit}
</style>
<div style="width: 390px; height: 1100px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; font-family: 'Noto Sans KR', -apple-system, system-ui, sans-serif; color: #262345; overflow: hidden; position: relative">

  <div style="height: 300px; margin-top: 44px; background: #4a2a5e; position: relative; flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 16px">
    <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0) 60%)"></div>
    <a href="Category.html" aria-label="뒤로" style="position: absolute; top: 6px; left: 8px; width: 44px; height: 44px; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <button type="button" aria-label="찜하기" style="position: absolute; top: 6px; right: 52px; width: 44px; height: 44px; border: 0; background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"></path></svg></button>
    <button type="button" aria-label="공유" style="position: absolute; top: 6px; right: 8px; width: 44px; height: 44px; border: 0; background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"></path></svg></button>
    <span style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; color: rgba(255, 255, 255, 0.5)">[일러스트 · 16:10]</span>
    <span style="position: relative; display: inline-flex; align-items: center; gap: 6px"><span style="height: 22px; padding: 0 8px; border-radius: 6px; background: #fde8ef; color: #c2366b; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">연애</span><span style="height: 22px; padding: 0 8px; border-radius: 6px; background: #f2b544; color: #191600; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">유료</span></span>
    <h1 style="position: relative; margin: 8px 0 0; font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 700; line-height: 1.25; color: #ffffff">연애 성향 · 관계 패턴 풀이</h1>
    <span style="position: relative; font-size: 13px; color: rgba(255, 255, 255, 0.72); margin-top: 4px">★ 4.9 · 리뷰 1,284 · 구매 12,407</span>
  </div>

  <div style="display: flex; border-bottom: 1px solid #eceaf5; padding: 0 16px; flex-shrink: 0">
    <button type="button" aria-pressed="true" style="height: 48px; padding: 0 4px; margin-right: 20px; border: 0; border-bottom: 2px solid #6e5ce6; background: transparent; color: #262345; font-size: 15px; font-weight: 600; cursor: pointer">소개</button>
    <button type="button" aria-pressed="false" style="height: 48px; padding: 0 4px; margin-right: 20px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #625e80; font-size: 15px; font-weight: 500; cursor: pointer">내용 구성</button>
    <button type="button" aria-pressed="false" style="height: 48px; padding: 0 4px; margin-right: 20px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #625e80; font-size: 15px; font-weight: 500; cursor: pointer">예시</button>
    <button type="button" aria-pressed="false" style="height: 48px; padding: 0 4px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #625e80; font-size: 15px; font-weight: 500; cursor: pointer">후기</button>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 20px 16px 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.35">당신의 사랑 이야기를<br>가장 가까운 언어로 풀어드려요.</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #4a4668">일간과 배우자궁, 도화·홍염 같은 신살을 바탕으로 연애할 때의 나를 읽습니다. 한자 용어는 모두 풀어 써요.</p>
    </div>

    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px">
      <li style="display: flex; align-items: center; gap: 10px; font-size: 15px"><span style="width: 24px; height: 24px; border-radius: 999px; background: #fde8ef; color: #c2366b; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>연애 성향과 패턴 분석</li>
      <li style="display: flex; align-items: center; gap: 10px; font-size: 15px"><span style="width: 24px; height: 24px; border-radius: 999px; background: #fde8ef; color: #c2366b; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>이상형 &amp; 잘 맞는 관계 유형</li>
      <li style="display: flex; align-items: center; gap: 10px; font-size: 15px"><span style="width: 24px; height: 24px; border-radius: 999px; background: #fde8ef; color: #c2366b; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>연애에서 주의할 점</li>
      <li style="display: flex; align-items: center; gap: 10px; font-size: 15px"><span style="width: 24px; height: 24px; border-radius: 999px; background: #fde8ef; color: #c2366b; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>올해 관계 흐름 가이드</li>
    </ul>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; font-weight: 600">풀이 선택</span>
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #dcd9ea; border-radius: 16px; cursor: pointer">
        <input type="radio" name="plan" style="width: 20px; height: 20px; margin: 0; accent-color: #6e5ce6">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">기본 풀이 <span style="font-weight: 400; color: #716d8e">· 2항목</span></span><span style="font-size: 12px; color: #625e80">성향 + 패턴</span></span>
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">3,900원</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 2px solid #6e5ce6; border-radius: 16px; cursor: pointer; position: relative">
        <input type="radio" name="plan" checked style="width: 20px; height: 20px; margin: 0; accent-color: #6e5ce6">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">상세 풀이 <span style="font-weight: 400; color: #716d8e">· 4항목</span> <span style="height: 20px; padding: 0 6px; border-radius: 6px; background: #c2366b; color: #ffffff; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; vertical-align: middle; margin-left: 4px">인기</span></span><span style="font-size: 12px; color: #625e80">+ 이상형 · 주의점</span></span>
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">9,900원</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #dcd9ea; border-radius: 16px; cursor: pointer">
        <input type="radio" name="plan" style="width: 20px; height: 20px; margin: 0; accent-color: #6e5ce6">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">심층 풀이 <span style="font-weight: 400; color: #716d8e">· 8항목</span></span><span style="font-size: 12px; color: #625e80">+ 올해 흐름 · 추가 질문 3회</span></span>
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">19,900원</span>
      </label>
    </div>
  </main>

  <div style="padding: 12px 16px 36px; border-top: 1px solid #eceaf5; display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: #ffffff">
    <div style="display: flex; flex-direction: column; gap: 1px; flex-shrink: 0">
      <span style="font-size: 11px; color: #625e80">상세 풀이</span>
      <span style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">9,900원</span>
    </div>
    <a href="Reading.html" style="flex: 1; height: 52px; border-radius: 26px; background: #6e5ce6; color: #ffffff; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">구매하기</a>
  </div>
</div>
</body>
</html>
