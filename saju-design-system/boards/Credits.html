<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이용권 충전 화면</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff;color:#262345;font-family:'Noto Sans KR',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6e5ce6}a:hover{color:#5748c4;text-decoration:underline}
button{font-family:inherit}
</style>
<div style="width: 390px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; font-family: 'Noto Sans KR', -apple-system, system-ui, sans-serif; color: #262345; overflow: hidden; position: relative">

  <header style="height: 56px; margin-top: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; flex-shrink: 0">
    <a href="MyPage.html" aria-label="뒤로" style="width: 44px; height: 44px; color: #262345; display: inline-flex; align-items: center; justify-content: center; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="font-size: 15px; font-weight: 600">이용권 충전</span>
    <span style="width: 44px"></span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 4px 16px 16px; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 16px; background: #f7f6fc; border: 1px solid #eceaf5">
      <span style="font-size: 14px; color: #4a4668">현재 보유</span>
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums"><span style="width: 24px; height: 24px; border-radius: 999px; background: #f2b544; color: #4a3200; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v8"></path></svg></span>12장</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; font-weight: 600">충전 묶음 선택</span>
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #dcd9ea; border-radius: 16px; cursor: pointer">
        <input type="radio" name="pack" style="width: 20px; height: 20px; margin: 0; accent-color: #6e5ce6">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">3장</span><span style="font-size: 12px; color: #625e80">1장당 1,000원</span></span>
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">3,000원</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #dcd9ea; border-radius: 16px; cursor: pointer">
        <input type="radio" name="pack" style="width: 20px; height: 20px; margin: 0; accent-color: #6e5ce6">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px">6장 <span style="height: 20px; padding: 0 6px; border-radius: 6px; background: #fde8ef; color: #c2366b; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">8% 할인</span></span><span style="font-size: 12px; color: #625e80">1장당 917원</span></span>
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">5,500원</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 2px solid #6e5ce6; border-radius: 16px; cursor: pointer">
        <input type="radio" name="pack" checked style="width: 20px; height: 20px; margin: 0; accent-color: #6e5ce6">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px">12장 <span style="height: 20px; padding: 0 6px; border-radius: 6px; background: #fde8ef; color: #c2366b; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">17% 할인</span><span style="height: 20px; padding: 0 6px; border-radius: 6px; background: #6e5ce6; color: #ffffff; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">인기</span></span><span style="font-size: 12px; color: #625e80">1장당 825원</span></span>
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">9,900원</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #dcd9ea; border-radius: 16px; cursor: pointer">
        <input type="radio" name="pack" style="width: 20px; height: 20px; margin: 0; accent-color: #6e5ce6">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px">25장 <span style="height: 20px; padding: 0 6px; border-radius: 6px; background: #fde8ef; color: #c2366b; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">20% 할인</span></span><span style="font-size: 12px; color: #625e80">1장당 796원</span></span>
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">19,900원</span>
      </label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; font-weight: 600">결제 수단</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="true" style="height: 48px; border: 2px solid #6e5ce6; border-radius: 12px; background: #ffffff; color: #262345; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>카드 결제</button>
        <button type="button" aria-pressed="false" style="height: 48px; border: 1px solid #dcd9ea; border-radius: 12px; background: #ffffff; color: #4a4668; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2.5"></rect><path d="M11 18h2"></path></svg>간편 결제</button>
      </div>
    </div>

    <ul style="margin: 0; padding: 0 0 0 16px; font-size: 12px; line-height: 1.7; color: #625e80">
      <li>이용권은 구매 즉시 지급되며 유효기간은 1년입니다.</li>
      <li>사용하지 않은 이용권은 구매 후 7일 이내 전액 환불됩니다.</li>
    </ul>
  </main>

  <div style="padding: 12px 16px 36px; border-top: 1px solid #eceaf5; display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: #ffffff">
    <div style="display: flex; flex-direction: column; gap: 1px; flex-shrink: 0">
      <span style="font-size: 11px; color: #625e80">12장 · 17% 할인</span>
      <span style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">9,900원</span>
    </div>
    <button type="button" style="flex: 1; height: 52px; border: 0; border-radius: 26px; background: #6e5ce6; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer">결제하기</button>
  </div>
</div>
</body>
</html>
