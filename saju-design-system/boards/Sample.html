<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>사주 결과 화면 예시</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff;color:#262345;font-family:'Noto Sans KR',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6e5ce6}a:hover{color:#5748c4;text-decoration:underline}
button{font-family:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; font-family: 'Noto Sans KR', -apple-system, system-ui, sans-serif; color: #262345; overflow: hidden; position: relative">

  <header style="height: 56px; margin-top: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; flex-shrink: 0">
    <a href="MyPage.html" aria-label="뒤로" style="width: 44px; height: 44px; color: #262345; display: inline-flex; align-items: center; justify-content: center; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="font-size: 15px; font-weight: 600">내 사주 정보</span>
    <button type="button" aria-label="공유" style="width: 44px; height: 44px; border: 0; background: transparent; color: #262345; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"></path></svg></button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 8px 16px 24px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 500; color: #625e80">1992.03.14 · 양력 · 寅時</span>
      <h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em">하늘 님은 <span style="color: #257f60">甲木</span>,<br>곧게 자라는 큰 나무</h1>
    </div>

    <section aria-label="명식" style="border: 1px solid #dcd9ea; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="font-size: 11px; color: #716d8e">時</span>
          <div style="width: 100%; height: 56px; border-radius: 12px; background: #ffebd9; color: #b55a12; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 500">丙</div>
          <div style="width: 100%; height: 56px; border-radius: 12px; background: #e1f5ee; color: #257f60; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 500">寅</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="font-size: 11px; color: #262345; font-weight: 600">日</span>
          <div style="width: 100%; height: 56px; border-radius: 12px; background: #e1f5ee; color: #257f60; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 500; outline: 2px solid #257f60; outline-offset: 2px">甲</div>
          <div style="width: 100%; height: 56px; border-radius: 12px; background: #e1f5ee; color: #257f60; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 500">寅</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="font-size: 11px; color: #716d8e">月</span>
          <div style="width: 100%; height: 56px; border-radius: 12px; background: #fff4d6; color: #9a6700; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 500">戊</div>
          <div style="width: 100%; height: 56px; border-radius: 12px; background: #e3eefc; color: #2b63c6; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 500">子</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <span style="font-size: 11px; color: #716d8e">年</span>
          <div style="width: 100%; height: 56px; border-radius: 12px; background: #eceaf5; color: #716d8e; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 500">庚</div>
          <div style="width: 100%; height: 56px; border-radius: 12px; background: #ffebd9; color: #b55a12; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 500">午</div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid #eceaf5">
        <div style="display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px">
          <span style="flex: 4; background: #257f60"></span>
          <span style="flex: 2; background: #b55a12"></span>
          <span style="flex: 1; background: #9a6700"></span>
          <span style="flex: 1; background: #716d8e"></span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #4a4668">
          <span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #257f60"></span>木 4</span>
          <span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #b55a12"></span>火 2</span>
          <span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #9a6700"></span>土 1</span>
          <span style="display: inline-flex; align-items: center; gap: 4px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #716d8e"></span>金 1</span>
          <span style="display: inline-flex; align-items: center; gap: 4px; color: #625e80"><span style="width: 8px; height: 8px; border-radius: 999px; background: #dcd9ea"></span>水 0</span>
        </div>
      </div>
    </section>

    <div style="display: flex; gap: 8px">
      <button type="button" style="height: 36px; padding: 0 14px; border: 1px solid #6e5ce6; border-radius: 22px; background: #6e5ce6; color: #ffffff; font-size: 14px; font-weight: 600; cursor: pointer">오늘</button>
      <button type="button" style="height: 36px; padding: 0 14px; border: 1px solid #dcd9ea; border-radius: 22px; background: #ffffff; color: #4a4668; font-size: 14px; font-weight: 500; cursor: pointer">이번 달</button>
      <button type="button" style="height: 36px; padding: 0 14px; border: 1px solid #dcd9ea; border-radius: 22px; background: #ffffff; color: #4a4668; font-size: 14px; font-weight: 500; cursor: pointer">2026년</button>
      <button type="button" style="height: 36px; padding: 0 14px; border: 1px solid #dcd9ea; border-radius: 22px; background: #ffffff; color: #4a4668; font-size: 14px; font-weight: 500; cursor: pointer">대운</button>
    </div>

    <article style="border: 1px solid #dcd9ea; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 12px; font-weight: 500; color: #625e80">오늘 · 11월 9일 월요일</span>
        <span style="height: 24px; padding: 0 10px; border-radius: 6px; background: #257f60; color: #ffffff; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">길 吉</span>
      </div>
      <h2 style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; line-height: 1.3">말보다 글이 통하는 날</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4a4668">부족한 水 기운이 오늘 들어와 甲木의 뿌리를 적십니다. 미뤄 둔 메시지를 보내면 뜻밖의 답이 옵니다.</p>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span style="height: 28px; padding: 0 10px; border-radius: 22px; background: #e3eefc; color: #2b63c6; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">水 보강</span>
        <span style="height: 28px; padding: 0 10px; border-radius: 22px; background: #eceaf5; color: #4a4668; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">행운색 남색</span>
        <span style="height: 28px; padding: 0 10px; border-radius: 22px; background: #eceaf5; color: #4a4668; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center">방향 북쪽</span>
      </div>
    </article>

    <div style="display: flex; gap: 8px; flex-shrink: 0">
      <button type="button" style="flex: 1; height: 52px; border: 0; border-radius: 26px; background: #6e5ce6; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px">상세 풀이 보기<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg></button>
      <button type="button" style="height: 52px; padding: 0 18px; border: 0; border-radius: 26px; background: #6e5ce6; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.9 6.9L22 9.3l-5.5 4.8L18.2 22 12 18.3 5.8 22l1.7-7.9L2 9.3l7.1-.4z"></path></svg>운세 뽑기</button>
    </div>
  </main>

  <nav aria-label="주 메뉴" style="height: 56px; padding-bottom: 28px; border-top: 1px solid #dcd9ea; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; background: #ffffff; flex-shrink: 0; box-sizing: content-box">
    <a href="Home.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #625e80; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"></path></svg>홈</a>
    <a href="Category.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #625e80; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>탐색</a>
    <a href="Library.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #625e80; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>보관함</a>
    <a href="MyPage.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #262345; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>마이</a>
  </nav>
</div>
</body>
</html>
