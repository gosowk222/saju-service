<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>추가 질문 구매 화면</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff;color:#262345;font-family:'Noto Sans KR',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6e5ce6}a:hover{color:#5748c4;text-decoration:underline}
button{font-family:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; font-family: 'Noto Sans KR', -apple-system, system-ui, sans-serif; color: #262345; overflow: hidden; position: relative">

  <header style="height: 56px; margin-top: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; flex-shrink: 0">
    <a href="Reading.html" aria-label="뒤로" style="width: 44px; height: 44px; color: #262345; display: inline-flex; align-items: center; justify-content: center; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="font-size: 15px; font-weight: 600">추가 질문 구매</span>
    <span style="width: 44px"></span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 4px 16px 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 24px; font-weight: 700; line-height: 1.3">무료 질문을 다 쓰셨어요</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #4a4668">구매한 풀이에 대해 더 물어볼 수 있는 질문 횟수를 추가합니다. 이용권으로도 결제할 수 있어요.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #dcd9ea; border-radius: 16px; cursor: pointer">
        <input type="radio" name="qpack" style="width: 20px; height: 20px; margin: 0; accent-color: #6e5ce6">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #fff4d6; color: #9a6700; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0">3</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">3회</span><span style="font-size: 12px; color: #625e80">1회당 333원</span></span>
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">1,000원</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 2px solid #6e5ce6; border-radius: 16px; cursor: pointer">
        <input type="radio" name="qpack" checked style="width: 20px; height: 20px; margin: 0; accent-color: #6e5ce6">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #fff4d6; color: #9a6700; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0">10</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px">10회 <span style="height: 20px; padding: 0 6px; border-radius: 6px; background: #fde8ef; color: #c2366b; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">12% 할인</span></span><span style="font-size: 12px; color: #625e80">1회당 290원</span></span>
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">2,900원</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #dcd9ea; border-radius: 16px; cursor: pointer">
        <input type="radio" name="qpack" style="width: 20px; height: 20px; margin: 0; accent-color: #6e5ce6">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #fff4d6; color: #9a6700; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0">30</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px">30회 <span style="height: 20px; padding: 0 6px; border-radius: 6px; background: #fde8ef; color: #c2366b; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center">23% 할인</span></span><span style="font-size: 12px; color: #625e80">1회당 230원</span></span>
        <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">6,900원</span>
      </label>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 16px; background: #f7f6fc; border: 1px solid #eceaf5">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 14px; font-weight: 600">이용권으로 결제</span>
        <span style="font-size: 12px; color: #625e80">보유 12장 · 10회 = 3장 차감</span>
      </div>
      <button type="button" role="switch" aria-checked="false" aria-label="이용권으로 결제" style="width: 48px; height: 28px; border: 0; border-radius: 14px; background: #dcd9ea; position: relative; cursor: pointer; flex-shrink: 0"><span style="position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 999px; background: #ffffff"></span></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">안내 사항</span>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.55; color: #4a4668">
        <li style="display: flex; gap: 8px"><span style="width: 4px; height: 4px; border-radius: 999px; background: #a9a6c0; margin-top: 8px; flex-shrink: 0"></span>기존에 구매한 풀이에 대한 추가 질문만 가능해요.</li>
        <li style="display: flex; gap: 8px"><span style="width: 4px; height: 4px; border-radius: 999px; background: #a9a6c0; margin-top: 8px; flex-shrink: 0"></span>구매 즉시 사용할 수 있고, 유효기간은 90일입니다.</li>
        <li style="display: flex; gap: 8px"><span style="width: 4px; height: 4px; border-radius: 999px; background: #a9a6c0; margin-top: 8px; flex-shrink: 0"></span>심층 풀이에는 질문 3회가 기본 포함되어 있어요.</li>
      </ul>
    </div>
  </main>

  <div style="padding: 12px 16px 36px; border-top: 1px solid #eceaf5; display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: #ffffff">
    <div style="display: flex; flex-direction: column; gap: 1px; flex-shrink: 0">
      <span style="font-size: 11px; color: #625e80">10회</span>
      <span style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums">2,900원</span>
    </div>
    <button type="button" style="flex: 1; height: 52px; border: 0; border-radius: 26px; background: #6e5ce6; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer">구매하기</button>
  </div>
</div>
</body>
</html>
